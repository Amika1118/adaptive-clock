; ---------------------------------------------------------------- measures
[mAccent]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegSubKey=Software\Microsoft\Windows\DWM
RegValue=AccentColor

[mLum]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#WallpaperLuma.ps1"
OutputType=ANSI
State=Hide
Timeout=20000
UpdateDivider=600

[mMain]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=main

[mSecF]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=secF

[mMinF]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=minF

[mHrF]
