Mode=worldName

[mWDay]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=worldDay

[mWTime]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=worldTime

[mWordA]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=wordsA

[mWordB]
Measure=Script
ScriptFile=#CURRENTPATH#AdaptiveClock.lua
Mode=wordsB

[mOne]
Measure=Calc
Formula=1

[mH]
Measure=Time
Format=#HourFormat#

[mM]
Measure=Time
Format=%M

[mS]
Measure=Time
Format=%S

[mDow]
Measure=Time
Format=%A

[mDowS]
Measure=Time
Format=%a

[mDnum]
Measure=Time
Format=%#d

[mMon]
Measure=Time
Format=%B

[mMonS]
